[project]
name = "api-contract-guardrails-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认逐用例列出名称与通过/失败情况，便于一眼看出各业务的覆盖情况；
# 需要更精简输出时可显式 `pytest -q`。
addopts = "-v"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
